<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budgets - AI Finance Assistant</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>Budgets</h1>

    <p>
        Set and manage your monthly spending budgets.
    </p>

    <form method="POST" action="/budgets">

        <label for="category">Category</label>

        <input
            type="text"
            id="category"
            name="category"
            placeholder="e.g. Food, Travel, Shopping"
            required
        >

        <label for="amount">Monthly Budget</label>

        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            placeholder="Enter budget amount"
            required
        >

        <button type="submit">
            Set Budget
        </button>

    </form>

    <div class="transaction-history">

        <h2>Budget History</h2>

        {% if budgets %}

            <div class="table-wrapper">

                <table class="transaction-table">

                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Monthly Budget</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for budget in budgets %}

                        <tr>
                            <td>{{ budget.category }}</td>
                            <td>₹{{ budget.amount }}</td>
                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        {% else %}

            <p class="no-transactions">
                No budgets set yet.
            </p>

        {% endif %}

    </div>

</div>

</body>
</html>
