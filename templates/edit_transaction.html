<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction - AI Finance Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>Edit Transaction</h1>

    <p>Update the transaction details below.</p>

    <form method="POST">

        <label for="type">Transaction Type</label>

        <select id="type" name="type" required>

            <option value="income"
                {% if transaction.type == "income" %}selected{% endif %}>
                Income
            </option>

            <option value="expense"
                {% if transaction.type == "expense" %}selected{% endif %}>
                Expense
            </option>

        </select>

        <label for="amount">Amount</label>

        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
            min="0"
            value="{{ transaction.amount }}"
            required
        >

        <label for="category">Category</label>

        <input
            type="text"
            id="category"
            name="category"
            value="{{ transaction.category }}"
            required
        >

        <label for="description">Description</label>

        <input
            type="text"
            id="description"
            name="description"
            value="{{ transaction.description }}"
        >

        <label for="date">Date</label>

        <input
            type="date"
            id="date"
            name="date"
            value="{{ transaction.date }}"
            required
        >

        <button type="submit">
            Update Transaction
        </button>

    </form>

</div>

</body>
</html>
